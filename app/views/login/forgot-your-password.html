{% extends "layout-volunteer-jdr.html" %}

{% block content %}
  
<div class="nhsuk-grid-row">
    <div class="nhsuk-grid-column-two-thirds">

      <div class="nhsuk-grid-row">
    <div class="nhsuk-grid-column-two-thirds">

      <h1 class="nhsuk-heading-l">Reset Password</h1>

      <p>To reset your password, enter your email address below.</p>

      <form action="/{{folder}}/{{subfolder}}/researcher-login" method="post" novalidate>
  
      {{ input({
        id: "emailAddress",
        name: "emailAddress",
        type: "email",
        classes: "nhsuk-input--width-20",
        label: {
          text: "Email address"
        }
      }) }}

      <button class="nhsuk-button jdr-button-pink" data-module="nhsuk-button" type="submit">
      Continue
      </button>

      </form>

    </div>
  </div>
        
      </form>
    </div>
  </div>
</div>
{% endblock %}
