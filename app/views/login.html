{% extends "layout-volunteer-jdr.html" %}

{% block content %}
  <div class="nhsuk-grid-row">
    <div class="nhsuk-grid-column-two-thirds">
      <h1 class="nhsuk-heading-l">
        Log into your account
      </h1>

      <form action="/form-handler" method="post" novalidate>

        <div class="nhsuk-form-group">
          <label class="nhsuk-label nhsuk-label--s" for="firstName">
            Email
          </label>
          <input class="nhsuk-input" id="firstName" name="firstName" type="text" autocomplete="given-name" spellcheck="false">
        </div>

        <div class="nhsuk-form-group">
          <label class="nhsuk-label nhsuk-label--s" for="lastName">
            Password
          </label>
          <input class="nhsuk-input" id="lastName" name="lastName" type="text" autocomplete="family-name" spellcheck="false">
        </div>

        <button class="nhsuk-button" data-module="nhsuk-button" type="submit">
          Log in
        </button>
        
        <p>
          <a href="#" class="nhsuk-link">Forgotten password?</a>
        </p>

      </form>
    </div>
  </div>
{% endblock %}
